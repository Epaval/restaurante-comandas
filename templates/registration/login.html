<!-- templates/registration/login.html -->
{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión - Restaurante</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            background: linear-gradient(135deg, #1a1a2e, #16213e, #0f3460);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .login-card {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            padding: 2.5rem;
            max-width: 400px;
            width: 100%;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            backdrop-filter: blur(10px);
        }
        .login-card .logo {
            text-align: center;
            margin-bottom: 2rem;
        }
        .login-card .logo i {
            font-size: 3rem;
            color: #0f3460;
            background: #e8f0fe;
            padding: 1rem;
            border-radius: 50%;
        }
        .login-card .logo h1 {
            font-size: 1.8rem;
            font-weight: 700;
            color: #0f3460;
            margin-top: 0.5rem;
        }
        .login-card .logo p {
            color: #6c757d;
            font-size: 0.95rem;
        }
        .form-control {
            border-radius: 10px;
            padding: 0.75rem 1rem;
            border: 2px solid #e9ecef;
            transition: all 0.3s;
        }
        .form-control:focus {
            border-color: #0f3460;
            box-shadow: 0 0 0 0.2rem rgba(15, 52, 96, 0.25);
        }
        .btn-primary {
            background: #0f3460;
            border: none;
            border-radius: 10px;
            padding: 0.75rem;
            font-weight: 600;
            width: 100%;
            transition: all 0.3s;
        }
        .btn-primary:hover {
            background: #1a4a7a;
            transform: translateY(-2px);
            box-shadow: 0 4px 15px rgba(15, 52, 96, 0.3);
        }
        .alert {
            border-radius: 10px;
        }
        .users-table {
            margin-top: 1.5rem;
            font-size: 0.85rem;
        }
        .users-table th {
            font-size: 0.75rem;
            text-transform: uppercase;
            color: #6c757d;
        }
    </style>
</head>
<body>
    <div class="login-card">
        <div class="logo">
            <i class="fas fa-utensils"></i>
            <h1>Restaurante</h1>
            <p>Sistema de gestión de comandas</p>
        </div>

        {% if messages %}
            {% for message in messages %}
                <div class="alert alert-{{ message.tags }} alert-dismissible fade show">
                    {{ message }}
                    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                </div>
            {% endfor %}
        {% endif %}

        {% if form.errors %}
            <div class="alert alert-danger">
                <i class="fas fa-exclamation-circle"></i>
                Usuario o contraseña incorrectos. Intenta nuevamente.
            </div>
        {% endif %}

        <form method="post">
            {% csrf_token %}
            <div class="mb-3">
                <label for="username" class="form-label fw-bold">
                    <i class="fas fa-user"></i> Usuario
                </label>
                <input type="text" name="username" id="username" class="form-control" placeholder="Ingresa tu usuario" required>
            </div>
            <div class="mb-3">
                <label for="password" class="form-label fw-bold">
                    <i class="fas fa-lock"></i> Contraseña
                </label>
                <input type="password" name="password" id="password" class="form-control" placeholder="Ingresa tu contraseña" required>
            </div>
            <button type="submit" class="btn btn-primary">
                <i class="fas fa-sign-in-alt"></i> Ingresar
            </button>
        </form>

        <!-- Tabla de usuarios de prueba -->
       
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
